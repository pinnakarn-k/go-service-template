app:
  name: go-service-template

server:
  port: 8080
  body_limit_mb: 10

cors:
  allow_origins: "*"
  allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
  allow_headers: "*"

http_client:
  timeout: 30s

auth:
  cookie_name: x-my-service-token
  jwt_secret: local-dev-secret-123456

database:
  postgres:
    host: localhost
    port: 5432
    user: user
    password: password
    name: go_service_template
    ssl_mode: disable
    max_open_conns: 25
    max_idle_conns: 25
    conn_max_lifetime: 5m

integration:
  get_products:
    url: https://dummyjson.com/products
    application: product-app
    requester: product-requester
    key: 0123456789ABCDEF
    base64_mode: standard

  get_carts:
    url: https://dummyjson.com/carts
    application: cart-app
    requester: cart-requester
    key: 0123456789ABCDEF
    base64_mode: url

  get_posts:
    url: https://jsonplaceholder.typicode.com/posts
    application: post-app
    requester: post-requester
    key: 0123456789ABCDEF
    base64_mode: raw_url

  get_post_by_id:
    url: https://jsonplaceholder.typicode.com/posts/%d
    application: post-by-id-app
    requester: post-by-id-requester
    key: 0123456789ABCDEF
    base64_mode: raw_url