app:
  name: go-service-template

server:
  port: 8080
  body_limit: 4194304

cors:
  allow_origins: "*"
  allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
  allow_headers: "*"

http_client:
  timeout: 30s

auth:
  cookie_name: x-my-service
  jwt_secret: local-dev-secret-123456

dummyjson:
  base_url: https://dummyjson.com

jsonplaceholder:
  base_url: https://jsonplaceholder.typicode.com